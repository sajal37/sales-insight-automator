name: CI Pipeline

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  # ════════════════════════════════════════════
  # Backend — Lint, Type Check, Test, Build
  # ════════════════════════════════════════════
  backend:
    name: Backend CI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Lint with Ruff
        run: ruff check app/ tests/

      - name: Format check with Ruff
        run: ruff format --check app/ tests/

      - name: Security audit (pip-audit)
        run: |
          pip install pip-audit
          pip-audit --strict 2>/dev/null || echo "::warning::Some vulnerabilities found"

      - name: Run tests
        env:
          API_KEY: test-key-for-ci
          LLM_PROVIDER: gemini
          LLM_FALLBACK_PROVIDER: groq
          GEMINI_API_KEY: fake-key
          GROQ_API_KEY: fake-key
          RESEND_API_KEY: fake-key
          REDIS_URL: ""
          DATABASE_URL: sqlite:///tmp/ci_jobs.db
        run: pytest tests/ -v --tb=short

      - name: Build Docker image
        run: docker build -t sia-backend:ci .

  # ════════════════════════════════════════════
  # Frontend — Lint, Type Check, Build
  # ════════════════════════════════════════════
  frontend:
    name: Frontend CI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci 2>/dev/null || npm install

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      - name: Build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000
          NEXT_PUBLIC_API_KEY: ci-test-key
        run: npm run build

      - name: Security audit
        run: npm audit --audit-level=high 2>/dev/null || echo "::warning::Some vulnerabilities found"

      - name: Build Docker image
        run: docker build -t sia-frontend:ci .

  # ════════════════════════════════════════════
  # Docker Compose — Integration Smoke Test
  # ════════════════════════════════════════════
  docker-compose:
    name: Docker Compose Build
    runs-on: ubuntu-latest
    needs: [backend, frontend]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create backend .env for CI
        run: |
          cat > backend/.env << 'EOF'
          API_KEY=ci-test-key
          LLM_PROVIDER=gemini
          GEMINI_API_KEY=fake-key
          RESEND_API_KEY=fake-key
          ALLOWED_ORIGINS=http://localhost:3000
          EOF

      - name: Build all services
        run: docker compose build

      - name: Verify images
        run: |
          docker images | grep sia
